<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>SW-TEST-RUNNING</title></head>
<body>
<pre id="out">testing...</pre>
<script>
(async () => {
  const lines = [];
  const done = () => { document.getElementById('out').textContent = lines.join('\n'); document.title = 'SW-TEST-OK|' + lines.join('|'); };
  const fail = (e) => { lines.push('ERROR: ' + e.message); document.title = 'SW-TEST-ERR|' + lines.join('|'); };
  try {
    if (!('serviceWorker' in navigator)) throw new Error('no SW support');
    const reg = await navigator.serviceWorker.register('sw.js');
    lines.push('register scope=' + reg.scope);
    const ready = await navigator.serviceWorker.ready;
    lines.push('state=' + ready.active.state);
    await new Promise(r => setTimeout(r, 2000));
    const names = await caches.keys();
    lines.push('caches=' + names.join(','));
    const c = await caches.open(names[0]);
    const keys = await c.keys();
    lines.push('precached=' + keys.length);
    const resp = await fetch('index.html', { cache: 'no-cache' });
    lines.push('fetchIndex=' + resp.status);
  } catch (e) { fail(e); return; }
  done();
})();
</script>
</body>
</html>
